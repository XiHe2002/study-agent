services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: studyagent-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - studyagent_qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  studyagent_qdrant_data:
    name: studyagent_qdrant_data